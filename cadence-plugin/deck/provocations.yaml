# Cadence Provocation Deck
#
# Used by /brainstorm to provoke divergent thinking.
# The agent deals cards from this deck. It does NOT generate ideas.
# Users can create a local deck file to extend.
#
# Categories:
#   oblique       — Eno/Schmidt-style lateral thinking prompts
#   scamper       — Structured creativity (Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse)
#   hmw           — "How might we..." reframing prompts
#   analogy       — Forced analogy and cross-domain prompts
#   challenge     — Push-through-the-cliff prompts for when energy dips
#   thinking-hats — de Bono Six Thinking Hats (one mode at a time)
#   verb-anchored — Verb-substitution prompts (shrink/expand/merge/...)
#                   that adapt to the user's content at runtime

cards:

  # === OBLIQUE ===

  - id: oblique-01
    category: oblique
    text: "Honor thy error as a hidden intention."

  - id: oblique-02
    category: oblique
    text: "What would your closest friend do?"

  - id: oblique-03
    category: oblique
    text: "Use an old idea."

  - id: oblique-04
    category: oblique
    text: "What is the reality of the situation?"

  - id: oblique-05
    category: oblique
    text: "Do the last thing first."

  - id: oblique-06
    category: oblique
    text: "Emphasize the flaws."

  - id: oblique-07
    category: oblique
    text: "What would happen if you did the opposite?"

  - id: oblique-08
    category: oblique
    text: "Remove ambiguity and convert to specifics."

  - id: oblique-09
    category: oblique
    text: "What is it not doing?"

  - id: oblique-10
    category: oblique
    text: "Make it more expensive."

  - id: oblique-11
    category: oblique
    text: "Abandon normal instruments."

  - id: oblique-12
    category: oblique
    text: "Repetition is a form of change."

  - id: oblique-13
    category: oblique
    text: "Don't be frightened of clichés."

  - id: oblique-14
    category: oblique
    text: "What mistakes did you make last time?"

  - id: oblique-15
    category: oblique
    text: "Only one element of each kind."

  - id: oblique-16
    category: oblique
    text: "The tape is now the music."

  - id: oblique-17
    category: oblique
    text: "Simple subtraction."

  - id: oblique-18
    category: oblique
    text: "Go to an extreme, move back to a more comfortable place."

  # === SCAMPER ===

  - id: scamper-01
    category: scamper
    text: "Substitute — What component, material, or person could you swap out?"

  - id: scamper-02
    category: scamper
    text: "Combine — What ideas, steps, or purposes could you merge?"

  - id: scamper-03
    category: scamper
    text: "Adapt — What else is like this? What could you borrow from another domain?"

  - id: scamper-04
    category: scamper
    text: "Modify — What if you changed the scale? Made it bigger, smaller, faster, slower?"

  - id: scamper-05
    category: scamper
    text: "Put to other use — Who else could use this? What else could this be used for?"

  - id: scamper-06
    category: scamper
    text: "Eliminate — What would happen if you removed a step, a role, or a constraint?"

  - id: scamper-07
    category: scamper
    text: "Reverse — What if you did it in the opposite order? Turned it inside out?"

  - id: scamper-08
    category: scamper
    text: "Substitute — What if a completely different person had to do this?"

  - id: scamper-09
    category: scamper
    text: "Combine — What if this had to serve two purposes at once?"

  - id: scamper-10
    category: scamper
    text: "Eliminate — What's the simplest version that would still work?"

  # === HOW MIGHT WE ===

  - id: hmw-01
    category: hmw
    text: "How might we solve this without any technology?"

  - id: hmw-02
    category: hmw
    text: "How might we make this work for someone who's never seen it before?"

  - id: hmw-03
    category: hmw
    text: "How might we turn this constraint into an advantage?"

  - id: hmw-04
    category: hmw
    text: "How might we make this so simple it explains itself?"

  - id: hmw-05
    category: hmw
    text: "How might we solve this if we had unlimited resources? Now — what's the cheapest version of that?"

  - id: hmw-06
    category: hmw
    text: "How might we make this delightful instead of just functional?"

  - id: hmw-07
    category: hmw
    text: "How might we solve the problem that comes after this problem?"

  - id: hmw-08
    category: hmw
    text: "How might we make this work if it had to run for 10 years without maintenance?"

  - id: hmw-09
    category: hmw
    text: "How might we approach this if failure had no consequences?"

  - id: hmw-10
    category: hmw
    text: "How might we make this useful even if only half of it works?"

  - id: hmw-11
    category: hmw
    text: "How might we build this so someone else could extend it without asking us?"

  - id: hmw-12
    category: hmw
    text: "How might we solve this for one person perfectly before solving it for everyone?"

  # === FORCED ANALOGY ===

  - id: analogy-01
    category: analogy
    text: "If this problem were a restaurant, what would be on the menu?"

  - id: analogy-02
    category: analogy
    text: "If this were a children's game, what would the rules be?"

  - id: analogy-03
    category: analogy
    text: "What would a gardener do with this problem?"

  - id: analogy-04
    category: analogy
    text: "If this were a physical space, what would the floor plan look like?"

  - id: analogy-05
    category: analogy
    text: "How would a jazz musician approach this?"

  - id: analogy-06
    category: analogy
    text: "If this problem were a season, which would it be and why?"

  - id: analogy-07
    category: analogy
    text: "What would this look like if it were a conversation between two people?"

  - id: analogy-08
    category: analogy
    text: "If you could only solve this with pen and paper, what would you draw?"

  - id: analogy-09
    category: analogy
    text: "What would a librarian do with this problem?"

  - id: analogy-10
    category: analogy
    text: "If this were a movie, what genre would it be? What would the plot twist be?"

  # === CHALLENGE (push-through-the-cliff) ===

  - id: challenge-01
    category: challenge
    text: "You've got good ones. Now give me a bad one — deliberately terrible."

  - id: challenge-02
    category: challenge
    text: "What's the version of this that would embarrass you? Now make it interesting."

  - id: challenge-03
    category: challenge
    text: "Combine two of your previous ideas that seem incompatible."

  - id: challenge-04
    category: challenge
    text: "What haven't you said yet because it seems too obvious?"

  - id: challenge-05
    category: challenge
    text: "What's the version you'd build if you were starting over tomorrow?"

  - id: challenge-06
    category: challenge
    text: "What would you do if this had to be done by Friday?"

  - id: challenge-07
    category: challenge
    text: "Steal from something you saw this week that has nothing to do with this."

  - id: challenge-08
    category: challenge
    text: "What's the version a 10-year-old would come up with?"

  # === OBLIQUE (cont.) ===

  - id: oblique-19
    category: oblique
    text: "Disconnect from desire."

  - id: oblique-20
    category: oblique
    text: "Use unqualified people."

  - id: oblique-21
    category: oblique
    text: "Question the heroic approach."

  - id: oblique-22
    category: oblique
    text: "Discover the recipes you are using and abandon them."

  - id: oblique-23
    category: oblique
    text: "Are there sections? Consider transitions."

  - id: oblique-24
    category: oblique
    text: "Look closely at the most embarrassing details and amplify them."

  - id: oblique-25
    category: oblique
    text: "Take a break."

  - id: oblique-26
    category: oblique
    text: "Once the search is in progress, something will be found."

  # === SCAMPER (cont.) ===

  - id: scamper-11
    category: scamper
    text: "What could you SUBSTITUTE here? Pick a person, material, place, or process and swap it."

  - id: scamper-12
    category: scamper
    text: "COMBINE this with something that doesn't normally belong with it."

  - id: scamper-13
    category: scamper
    text: "ADAPT something from a domain you'd never associate with this."

  - id: scamper-14
    category: scamper
    text: "MAGNIFY one part dramatically — what if it were 10x bigger? What does that surface?"

  - id: scamper-15
    category: scamper
    text: "What other USES could this serve that you haven't considered?"

  - id: scamper-16
    category: scamper
    text: "What could you ELIMINATE without losing the essence?"

  - id: scamper-17
    category: scamper
    text: "REARRANGE the sequence — what if the last step came first?"

  # === HOW MIGHT WE (cont.) ===

  - id: hmw-13
    category: hmw
    text: "How might we make this 10x faster than it needs to be?"

  - id: hmw-14
    category: hmw
    text: "How might we make this work with no internet, no electricity, no agents?"

  - id: hmw-15
    category: hmw
    text: "How might we make this feel like a gift instead of a chore?"

  - id: hmw-16
    category: hmw
    text: "How might we get someone outside this team to find this irresistible?"

  - id: hmw-17
    category: hmw
    text: "How might we make the worst version on purpose — what would that look like?"

  # === FORCED ANALOGY (cont.) ===

  - id: analogy-11
    category: analogy
    text: "If this idea were a song, what genre? What instrument carries the melody?"

  - id: analogy-12
    category: analogy
    text: "If this were a recipe, what's the surprise ingredient?"

  - id: analogy-13
    category: analogy
    text: "How would a librarian solve this? A jazz musician? A bricklayer?"

  - id: analogy-14
    category: analogy
    text: "What if this had to fit on a postcard? In a tweet? On a billboard?"

  - id: analogy-15
    category: analogy
    text: "What animal does this idea most resemble — and what does that suggest?"

  # === CHALLENGE (cont.) ===

  - id: challenge-09
    category: challenge
    text: "Set a two-minute stopwatch and write the dumbest possible idea."

  - id: challenge-10
    category: challenge
    text: "What's the most expensive way to do this? What does the cheapest way teach you?"

  - id: challenge-11
    category: challenge
    text: "What would a user say about this in five years?"

  - id: challenge-12
    category: challenge
    text: "Steal the structure of something you admire and apply it here."

  - id: challenge-13
    category: challenge
    text: "If you had to teach this to a kid, what's the one thing they'd remember?"

  # === THINKING HATS ===
  # de Bono's Six Thinking Hats. Each card invites one mode of thought
  # at a time — the discipline is in NOT mixing modes mid-card. Useful
  # standalone or run as a sequence (white → red → black → yellow →
  # green → blue) when the brainstorm warrants it.

  - id: thinking-hats-01
    category: thinking-hats
    text: "WHITE HAT — facts. What facts do you actually have? What facts are missing?"

  - id: thinking-hats-02
    category: thinking-hats
    text: "RED HAT — feelings. What does your gut say without justification? What's the feeling in the room?"

  - id: thinking-hats-03
    category: thinking-hats
    text: "BLACK HAT — caution. What's the realistic worst-case? What's the failure mode you'd defend against?"

  - id: thinking-hats-04
    category: thinking-hats
    text: "YELLOW HAT — benefits. If this works, what becomes possible? Who wins?"

  - id: thinking-hats-05
    category: thinking-hats
    text: "GREEN HAT — creativity. What's the wild card — the version that breaks the assumptions?"

  - id: thinking-hats-06
    category: thinking-hats
    text: "BLUE HAT — process. Where are you in the conversation? What's the next move?"

  # === VERB-ANCHORED ===
  # Verb-substitution prompts that adapt to the user's content at
  # runtime — the agent applies the verb to whatever the user is
  # brainstorming. These are strong cliff-pushers alongside challenge
  # cards because they force a fresh angle without prescribing one.

  - id: verb-anchored-01
    category: verb-anchored
    text: "SHRINK this — what's the smallest version that still works?"

  - id: verb-anchored-02
    category: verb-anchored
    text: "EXPAND this — what would the 10x version look like?"

  - id: verb-anchored-03
    category: verb-anchored
    text: "MERGE this with something else you're working on. What changes?"

  - id: verb-anchored-04
    category: verb-anchored
    text: "SEPARATE this — what's actually two ideas wearing one costume?"

  - id: verb-anchored-05
    category: verb-anchored
    text: "REVERSE the perspective — what if the people you're solving for were solving for you?"

  - id: verb-anchored-06
    category: verb-anchored
    text: "RELOCATE this — what changes if you move it to a different place, time, or domain?"

  - id: verb-anchored-07
    category: verb-anchored
    text: "AGE this — fast-forward five years. What does it look like? Now ten years in the past?"

  - id: verb-anchored-08
    category: verb-anchored
    text: "EXAGGERATE one feature dramatically. Then dial it back to find the right level."

  - id: verb-anchored-09
    category: verb-anchored
    text: "ANIMATE it — if it had a will of its own, what would it want?"

  - id: verb-anchored-10
    category: verb-anchored
    text: "PERSONIFY it — if it were a person at a dinner party, who?"
