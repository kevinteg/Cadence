name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # The bundled CLI is committed for distribution — fail if it is stale.
      - name: Verify cadence-plugin/bin/cadence is freshly bundled
        run: |
          npm run bundle
          if ! git diff --quiet -- cadence-plugin/bin/cadence; then
            echo "::error::cadence-plugin/bin/cadence is stale. Run 'npm run bundle' and commit."
            git --no-pager diff --stat -- cadence-plugin/bin/cadence
            exit 1
          fi

      - name: Test
        run: npm test

      # The Auggie fallback build is generated from cadence-plugin/ and committed.
      # Fail the build if the source plugin changed without regenerating it.
      - name: Verify auggie-plugin/ is in sync
        run: ./cadence-plugin/bin/cadence build-auggie --check
